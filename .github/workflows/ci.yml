name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]" -c constraints.txt

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run type checker (mypy)
        run: mypy vexinter services

      - name: Run tests
        env:
          VEXINTER_TEST_PG_DSN: postgresql://test:test@localhost:5432/test
        run: |
          pytest -v --tb=short --cov=vexinter --cov-report=term-missing --cov-report=xml

  sdk-ts:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./packages/sdk-ts

      - name: Run linter (eslint)
        run: npm run lint
        working-directory: ./packages/sdk-ts

      - name: Run type checker (tsc)
        run: npx tsc --noEmit
        working-directory: ./packages/sdk-ts

      - name: Run tests
        run: npm test
        working-directory: ./packages/sdk-ts

      - name: Build
        run: npm run build
        working-directory: ./packages/sdk-ts

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build
