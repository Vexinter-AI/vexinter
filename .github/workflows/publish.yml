name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-python:
    name: Build Python wheel (no se publica en ningun indice)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: python -m build
        working-directory: .

      - name: Guardar los paquetes como artefacto del release
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-typescript:
    name: Publish TypeScript SDK to GitHub Packages (npm)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@vexinter-ai"

      - name: Install dependencies
        run: npm ci
        working-directory: ./packages/sdk-ts

      - name: Build TypeScript SDK
        run: npm run build
        working-directory: ./packages/sdk-ts

      - name: Run tests
        run: npm test
        working-directory: ./packages/sdk-ts

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: ./packages/sdk-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
