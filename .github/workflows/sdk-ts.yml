name: SDK TypeScript
on:
  # workflow_dispatch: the public-release branch is force-pushed as a
  # single root commit, so path-filtered push events do not always fire.
  workflow_dispatch:
  push:
    paths:
      - "packages/sdk-ts/**"
      - "vexinter/**"
      - "services/**"
      - "constraints.txt"
      - ".github/workflows/sdk-ts.yml"
  pull_request:
    paths:
      - "packages/sdk-ts/**"
      - "vexinter/**"
      - "services/**"
      - "constraints.txt"
      - ".github/workflows/sdk-ts.yml"

jobs:
  sdk-ts:
    runs-on: ubuntu-latest
    env:
      VEXINTER_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Servicio de Python (para la prueba de punta a punta)
        run: pip install -c constraints.txt -e ".[server]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json
      - run: npm ci
        working-directory: packages/sdk-ts
      - run: npm run build
        working-directory: packages/sdk-ts
      - run: npm test
        working-directory: packages/sdk-ts
