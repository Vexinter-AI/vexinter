services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexinter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-vexinter_db}
    # Sin puerto publicado: solo accesible desde la red de compose.
    # Para depurar localmente, descomentar:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vexinter:
    build: .
    env_file: .env
    environment:
      - VEXINTER_PG_DSN=postgresql://${POSTGRES_USER:-vexinter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vexinter_db}
      - VEXINTER_AUTO_MIGRATE=1
      - VEXINTER_DEV_MODE=0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Override with VEXINTER_CPUS / VEXINTER_MEMORY in .env
          cpus: "${VEXINTER_CPUS:-2.0}"
          memory: "${VEXINTER_MEMORY:-2G}"
    restart: unless-stopped
    # Horizontal scaling: run multiple replicas behind a LB, but keep
    # VEXINTER_SCHEDULER_INTERVAL_S=0 on all but one (or use external cron),
    # follow-up execution is not leader-elected. Rate limiting and the
    # API sequence guard are already Postgres-backed and replica-safe.

volumes:
  pgdata:
