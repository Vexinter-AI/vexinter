[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexinter"
version = "0.5.1"
description = "Verification, memory, and secure communication infrastructure for AI agents"
readme = "README.md"
authors = [
    { name = "Vexinter Team" }
]
license = { text = "LicenseRef-Fair-Source (Community), see LICENSE-COMMUNITY.md" }
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "cryptography>=42",
    "httpx>=0.27",
    "numpy>=1.26",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
server  = ["fastapi>=0.110", "uvicorn[standard]", "psycopg[pool,binary]",
           "jinja2>=3.1", "python-multipart>=0.0.9"]
distributed = ["redis>=5.0"]
memory    = ["sqlite-vec>=0.1"]
dev     = ["pytest>=8", "pytest-cov", "ruff", "mypy", "jinja2>=3.1",
           "python-multipart>=0.0.9", "testcontainers>=4.6", "psycopg[pool,binary]"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# B008: Depends() en defaults es el idioma de FastAPI, no un bug
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# En tests, ejemplos y scripts los except amplios son aceptables
"tests/**" = ["BLE001"]
"examples/**" = ["BLE001"]
"scripts/**" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["vexinter"]
