[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vexinter-pro"
version = "0.3.0"
description = "Paid tiers for Vexinter: signed license enforcement and Professional/Business plan limits"
requires-python = ">=3.11"
license = { text = "LicenseRef-Vexinter-Proprietary" }
dependencies = [
    "vexinter",
    "httpx",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
